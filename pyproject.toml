[project]
name = "discovery-engine"
version = "0.1.0"
description = "Tracxn Discovery Engine Fleet"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "certifi",
    "fastapi",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "gspread",
    "gspread-asyncio",
    "numpy",
    "oauth2client",
    "openpyxl",
    "pandas",
    "psutil",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pytz",
    "requests",
    "httpx",
    "uvicorn[standard]",
    "pytest"
]

[tool.uv]
package = false
